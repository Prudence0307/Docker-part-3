name: RaceDay CI/CD

"on":
 push:
  branches: [ "main" ]
 pull_request:
  branches: [ "main" ]

jobs:
 build:
  runs-on:  windows-latest
 steps: 
-  name:   Checkout code
uses: actions/checkout@v4
- name: Setup .NET
uses: actions/setup-dotnet@v4
with:
dotnet-version: '8.0.x'
- name: Restore
run: dotnet restore
- name: Build
run: dotnet build --no-restore --configuration Release
- name: Test
run: dotnet test --no-build --verbosity normal
- name: Publish API
run: dotnet publish RaceDay.API/RaceDay.API.csproj -c Release -o publish-api
- name: Publish MVC
run: dotnet publish RaceDay.MVC/RaceDay.MVC.csproj -c Release -o publish-mvc
